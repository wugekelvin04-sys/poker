<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>德州扑克胜率</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="胜率">
<meta name="theme-color" content="#0b0e13">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest?v=v34">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=v34">
</head>
<body>

<header id="result" class="result">
  <div class="eq-label">我的胜率</div>
  <div class="eq-main"><span id="eqValue">—</span><span class="eq-unit">%</span></div>
  <div class="eq-note" id="eqNote">先选好自己的两张手牌</div>
  <div class="bar" id="bar">
    <span class="seg-w" id="barWin"></span><span class="seg-t" id="barTie"></span><span class="seg-l" id="barLose"></span>
  </div>
  <div class="legend">
    <span><i class="dot dot-w"></i>独赢 <b id="legWin">—</b></span>
    <span><i class="dot dot-t"></i>平分 <b id="legTie">—</b></span>
    <span><i class="dot dot-l"></i>输 <b id="legLose">—</b></span>
  </div>
  <div class="eq-explain" id="eqExplain" hidden></div>
</header>

<main>
  <section class="panel">
    <div class="phead">
      <h2>牌<em id="heroNotation"></em><em id="streetName">翻牌前</em></h2>
      <div class="acts">
        <button class="link" id="toggleHero">隐藏</button>
        <button class="link" data-clear="all">全清</button>
        <button class="link" data-clear="new">新一局</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="seat-row">
      <span class="seat-lbl">还剩<em>没弃牌的</em></span>
      <div class="seg" id="players"></div>
      <label class="money-lbl tight">共<input id="tableSize" type="text" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="seat-row"><span class="seat-lbl">对手水平</span><div class="seg lvl" id="oppLevel"></div></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>当前牌型</h2><button class="link" id="toggleDist">成牌分布</button></div>
    <div class="made" id="made">—</div>
    <div class="made-hint" id="madeHint" hidden></div>
    <div class="improve" id="improve"></div>
    <div class="dist" id="dist"></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>行动建议</h2>
      <div class="acts">
        <label class="hdr-money">我的筹码<input id="stack" type="text" inputmode="numeric" autocomplete="off"></label>
        <button class="link" id="clearOdds">清空</button>
      </div>
    </div>
    <div class="seat-row" id="posRow"><span class="seat-lbl">我的位置</span><div class="seg pos" id="pos"></div></div>
    <div class="seat-row" id="potRow">
      <label class="money-lbl">底池<input id="pot" type="text" inputmode="numeric" autocomplete="off"></label>
      <div class="seg money" id="potSeg"></div>
    </div>
    <div class="seat-row" id="callRow">
      <label class="money-lbl">要跟<input id="call" type="text" inputmode="numeric" autocomplete="off"></label>
      <div class="seg money" id="callSeg"></div>
    </div>
    <p class="hint" id="hintRow">底池 = 中间现在一共多少，已含他下的注；要跟填 0 = 没人下注</p>
    <div class="odds-out" id="oddsOut">填入底池金额</div>
  </section>

  <div class="ver"><button id="forceUpdate">版本 <span id="verNum">?</span> · 点这里强制更新</button></div>
</main>

<div class="sheet-mask" id="sheetMask" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="选牌">
  <div class="sheet-head">
    <span id="sheetTitle">选牌</span>
    <div>
      <button class="link" id="sheetRemove" hidden>移除</button>
      <button class="link" id="sheetClose">完成</button>
    </div>
  </div>
  <div class="deck" id="deck"></div>
</section>

<script src="engine.js?v=v34"></script>
<script src="sim.js?v=v34"></script>
<script src="preflop.js?v=v34"></script>
<script src="app.js?v=v34"></script>
<script>
/* 自愈：万一缓存里 HTML 和 JS 版本对不上导致初始化失败，
   自动清掉缓存重新加载一次，避免用户面对一个死掉的界面。
   带上 heal 参数只自愈一次，防止死循环。 */
(function () {
  setTimeout(function () {
    if (window.__APP_OK || location.search.indexOf('heal=') >= 0) return;
    var reload = function () { location.replace(location.pathname + '?heal=' + Date.now()); };
    var jobs = [];
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    Promise.all(jobs).then(reload, reload);
  }, 1800);
})();
</script>
</body>
</html>
