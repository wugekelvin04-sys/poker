<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>德州扑克胜率</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="胜率">
<meta name="theme-color" content="#0b0e13">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="result" class="result">
  <div class="eq-label">我的胜率</div>
  <div class="eq-main"><span id="eqValue">—</span><span class="eq-unit">%</span></div>
  <div class="eq-note" id="eqNote">先选好自己的两张手牌</div>
  <div class="bar" id="bar">
    <span class="seg-w" id="barWin"></span><span class="seg-t" id="barTie"></span><span class="seg-l" id="barLose"></span>
  </div>
  <div class="legend">
    <span><i class="dot dot-w"></i>胜 <b id="legWin">—</b></span>
    <span><i class="dot dot-t"></i>平 <b id="legTie">—</b></span>
    <span><i class="dot dot-l"></i>负 <b id="legLose">—</b></span>
  </div>
</header>

<main>
  <section class="panel">
    <div class="phead"><h2>我的手牌<em id="heroNotation"></em></h2><button class="link" data-clear="hero">清空</button></div>
    <div class="slots" id="heroSlots"></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>公共牌<em id="streetName">翻牌前</em></h2><button class="link" data-clear="board">清空</button></div>
    <div class="slots board" id="boardSlots"></div>
    <div class="board-legend"><span>翻牌</span><span>转牌</span><span>河牌</span></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>玩家人数<em>含我在内</em></h2></div>
    <div class="seg" id="players"></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>当前牌型</h2></div>
    <div class="made" id="made">—</div>
    <div class="improve" id="improve"></div>
    <div class="dist" id="dist"></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>底池赔率<em>该跟还是该弃</em></h2></div>
    <div class="odds-inputs">
      <label>底池<input id="pot" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></label>
      <label>需跟注<input id="call" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></label>
    </div>
    <p class="hint">底池填对手下注之后的总额，下面按对手的下注尺度自动算出你要跟的钱</p>
    <div class="quick" id="quickBets">
      <button data-frac="0.33">⅓ 池</button>
      <button data-frac="0.5">½ 池</button>
      <button data-frac="0.75">¾ 池</button>
      <button data-frac="1">满池</button>
    </div>
    <div class="odds-out" id="oddsOut">填入底池和需跟注的金额</div>
  </section>

  <footer class="foot">
    <span id="engineNote">全部计算在本机完成，不联网</span>
  </footer>
</main>

<div class="sheet-mask" id="sheetMask" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="选牌">
  <div class="sheet-head">
    <span id="sheetTitle">选牌</span>
    <div>
      <button class="link" id="sheetRemove" hidden>移除</button>
      <button class="link" id="sheetClose">完成</button>
    </div>
  </div>
  <div class="deck" id="deck"></div>
</section>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
